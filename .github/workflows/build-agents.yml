name: build-agents

on:
  push:
    branches: [main]
    paths: ['agents/**', 'shared/**', 'requirements.txt', '.github/workflows/build-agents.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - development
          - production
        default: development
      all:
        description: Deploy all agents (ignores the selections below)
        type: boolean
        default: true
      assistant:
        description: Deploy assistant
        type: boolean
        default: false
      analyst:
        description: Deploy analyst
        type: boolean
        default: false
      orchestrator:
        description: Deploy orchestrator
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --pre -r requirements.txt pytest
      - run: PYTHONPATH=. pytest tests

  select:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.pick.outputs.agents }}
      names: ${{ steps.pick.outputs.names }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          ALL: ${{ inputs.all }}
          ASSISTANT: ${{ inputs.assistant }}
          ANALYST: ${{ inputs.analyst }}
          ORCHESTRATOR: ${{ inputs.orchestrator }}
        run: |
          picked=()
          if [ "$EVENT" != workflow_dispatch ] || [ "$ALL" = true ]; then
            picked=(assistant analyst orchestrator)
          else
            [ "$ASSISTANT" = true ] && picked+=(assistant)
            [ "$ANALYST" = true ] && picked+=(analyst)
            [ "$ORCHESTRATOR" = true ] && picked+=(orchestrator)
          fi
          if [ ${#picked[@]} -eq 0 ]; then echo "No agents selected"; exit 1; fi
          echo "agents=$(printf '%s\n' "${picked[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "names=${picked[*]}" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, select]
    runs-on: ubuntu-latest
    # Environment secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
    # Environment variables: ACR_NAME, ACR_LOGIN_SERVER, AZURE_AI_PROJECT_ENDPOINT,
    # AZURE_AI_MODEL_DEPLOYMENT_NAME (platform outputs `acrName`, `acrLoginServer`, `foundryProjectEndpoint`).
    environment: ${{ inputs.environment || 'development' }}
    strategy:
      matrix:
        agent: ${{ fromJSON(needs.select.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push to platform ACR
        run: |
          az acr build -r "${{ vars.ACR_NAME }}" \
            -t "${{ matrix.agent }}-agent:${{ github.sha }}" \
            -t "${{ matrix.agent }}-agent:latest" \
            -f "agents/${{ matrix.agent }}/Dockerfile" .

  register:
    needs: [select, build]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: pip install --pre azure-ai-projects azure-identity
      - name: Register hosted agent versions in Foundry
        env:
          AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
          AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          STORAGE_ACCOUNT_URL: ${{ vars.STORAGE_ACCOUNT_URL }}
          IMAGE_TAG: ${{ github.sha }}
        run: python scripts/register_agents.py ${{ needs.select.outputs.names }}
